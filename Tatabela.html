<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table{
            border: 1px solid black;
            border-collapse: collapse;
            margin: 5px;
        }
        tr,th{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="2">Estudante</th>
            <th colspan="2">Formação</th>
            <th rowspan="2">Ano de conclusão</th>
        </tr>
        <tr>
            <th>Graduação</th>
            <th>Pós-graduação</th>
        </tr>
        <tr>
            <th>José</th>
            <th>Ciência da computação</th>
            <th>Engenharia de Software</th>
            <th>2009</th>
        </tr>
    </table>
    <table>
        <tr>
            <th></th>
            <th>Segunda</th>
            <th>Terça</th>
            <th>Quarta</th>
            <th>Quinta</th>
            <th>Sexta</th>
        </tr>
        <tr>
            <th>Manhã</th>
            <th colspan="5"> - </th>
            
        </tr>
        <tr>
            <th>Tarde</th>
            <th>NPI e monitoria</th>
            <th>NPI</th>
            <th>NPI e monitoria</th>
            <th>NPI</th>
            <th>NPI</th>
        </tr>
        <tr>
            <th>Noite</th>
            <th>Aula de pré-calculo</th>
            <th>Aula de POO</th>
            <th>Aula de html e css</th>
            <th>aula de Java</th>
            <th> - </th>
        </tr>
    </table>
</body>
</html>
