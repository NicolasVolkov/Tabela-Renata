<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table{
            border: 1px solid black;
            border-collapse: collapse;
            margin: 5px;
        }
        tr,th{
            border: 1px solid black;
        }
        .cor1{
            background-color: brown;
            color: white;
            width: 60px;
        }
        .cor2{
            background-color: aquamarine;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="2">Estudante</th>
            <th colspan="2">Formação</th>
            <th rowspan="2">Ano de conclusão</th>
        </tr>
        <tr>
            <th>Graduação</th>
            <th>Pós-graduação</th>
        </tr>
        <tr>
            <th>José</th>
            <th>Ciência da computação</th>
            <th>Engenharia de Software</th>
            <th>2009</th>
        </tr>
    </table>
    <table>
        <tr>
            <th class="cor1"></th>
            <th class="cor1">Segunda</th>
            <th class="cor1">Terça</th>
            <th class="cor1">Quarta</th>
            <th class="cor1">Quinta</th>
            <th class="cor1">Sexta</th>
        </tr>
        <tr>
            <th class="cor1">Manhã</th>
            <th class="cor2" colspan="5"> - </th>
            
        </tr>
        <tr>
            <th class="cor1">Tarde</th>
            <th class="cor2">NPI e monitoria</th>
            <th class="cor2">NPI</th>
            <th class="cor2">NPI e monitoria</th>
            <th class="cor2">NPI</th>
            <th class="cor2">NPI</th>
        </tr>
        <tr>
            <th class="cor1">Noite</th>
            <th class="cor2">Aula de pré-calculo</th>
            <th class="cor2">Aula de POO</th>
            <th class="cor2">Aula de html e css</th>
            <th class="cor2">Aula de Java</th>
            <th class="cor2">Aula vaga</th>
        </tr>
    </table>
</body>
</html>
